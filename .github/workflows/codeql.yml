name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 6 * * MON'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analysis:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read # only needed for private or internal repositories
      contents: read # only needed for private or internal repositories
      security-events: write # to upload the SARIF results to code scanning

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
          - language: go
            build-mode: autobuild
          - language: java
            build-mode: none
          - language: javascript
            build-mode: none
          - language: python
            build-mode: none

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6.1.0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.1
      with:
        build-mode: ${{ matrix.build-mode }}
        languages: ${{ matrix.language }}

    - name: Build
      if: matrix.language == 'csharp'
      run: dotnet build GrotsPizzeria.slnx --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.1
      with:
        category: '/language:${{ matrix.language }}'

  codeql:
    name: codeql
    if: ${{ !cancelled() }}
    needs: [ analysis ]
    runs-on: ubuntu-latest

    steps:
    - name: Report status
      shell: bash
      env:
        SCAN_SUCCESS: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      run: |
        if [ "${SCAN_SUCCESS}" == "true" ]
        then
          echo 'CodeQL analysis successful ✅'
        else
          echo 'CodeQL analysis failed ❌'
          exit 1
        fi
